tunnel: 182abd1d-0159-4e5b-961d-450221598321
# Referenced where `cloudflared tunnel create` already wrote it, rather than
# copied into /etc/cloudflared - one fewer place the secret exists.
credentials-file: /root/.cloudflared/182abd1d-0159-4e5b-961d-450221598321.json

# This one runs on the HOST, not in a container, and that is the entire point.
#
# pve-ssh.* goes through the tunnel in CT 102, and CT 102 reaches the internet
# via vmbr0 -> nic0 -> the LAN router, exactly like every other container. It
# does not route through the host. So when the USB NIC drops, that tunnel dies
# with it and there is no way in at all - which is what happened on 2026-09-08
# and cost half an hour of someone typing at the physical console.
#
# cloudflared here uses the HOST's routing table, and wifi-failover.timer moves
# that to wlp59s0 when the wired gateway stops answering. Wired dies -> host
# swings to wifi -> this tunnel reconnects over wifi -> the box is still
# reachable. It reaches only the host, not the containers, but the host is where
# nic0 gets fixed from, so that is the one that matters.
#
# Deliberately a separate tunnel from ops. The same tunnel run from two places
# is an HA pair that load-balances between them, and these two have different
# ingress rules - requests would land on whichever answered first.
ingress:
  # SSH only - there is no web service behind this one, so a browser pointed at
  # it gets nothing to render. Use `ssh pve-direct`.
  - hostname: pve-direct.anthonychiappone.com
    service: ssh://localhost:22

  # The PVE web UI, moved here from the CT 102 tunnel. It was always the host's
  # own service; serving it from the host's own tunnel means it survives CT 102
  # dying and follows the wifi failover, which is the whole point. localhost
  # rather than 10.20.1.43 so it does not depend on the bridge either.
  - hostname: pve.anthonychiappone.com
    service: https://localhost:8006
    originRequest:
      noTLSVerify: true

  # A second route to the Dev-Ops dashboard. pve-ops lives in CT 102, but this
  # reaches it across vmbr1 - a bridge with no physical port, so it keeps
  # working when nic0 dies and CT 102 loses the LAN. ops.* goes through CT 102's
  # own tunnel and dies with it; on 2026-09-09 that left the dashboard dark for
  # four hours while the host itself was reachable the whole time.
  - hostname: ops-direct.anthonychiappone.com
    service: http://10.10.10.2:8780

  # The K2 printer's Fluidd UI. Served from the host because the host sits on
  # the same wifi subnet as the printer (10.20.5.x) and can reach it directly -
  # so nothing has to be installed on the printer, and nothing here is lost when
  # Creality ships a firmware update.
  #
  # DANGEROUS WITHOUT ACCESS. Moonraker behind this has no authentication of any
  # kind: /server/info, print state and the file list all answer unauthenticated.
  # Anyone reaching this hostname can upload and run gcode, move the axes and set
  # the hotend temperature. This must sit behind a Cloudflare Access policy
  # before its DNS record is created, not after.
  - hostname: k2-printer.anthonychiappone.com
    service: http://10.20.5.28:4408

  - service: http_status:404
