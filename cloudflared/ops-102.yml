tunnel: 9c320e89-1beb-4267-98e1-95b8f07d0383
credentials-file: /etc/cloudflared/9c320e89-1beb-4267-98e1-95b8f07d0383.json

# pve-ops binds 127.0.0.1 inside this container, so the tunnel is the only path
# to it. Separate container and separate tunnel from the printer dashboard on
# purpose: when 101 wedges, this is what you use to see why.
#
# pve-ssh.* reaches the HOST, not this container - it is what lets the
# `npm run dev` tasks work from outside the office. Password auth is disabled
# on that host, and this must also be gated by Cloudflare Access or it is an
# open SSH endpoint on a hypervisor.
# (ssh.anthonychiappone.com was already taken by an unrelated record.)
#
# The same applies to pve.* below, more so: it is the hypervisor's root login
# page. Every hostname here must sit behind a Cloudflare Access policy.
ingress:
  - hostname: ops.anthonychiappone.com
    service: http://localhost:8780
  - hostname: pve-ssh.anthonychiappone.com
    service: ssh://10.20.1.43:22
  # The stock PVE web UI, also on the HOST. Its certificate is the node's own
  # self-signed one, so the tunnel has to skip verification on the last hop -
  # that hop is a bridge-local TCP connection, not the internet.
  - hostname: pve.anthonychiappone.com
    service: https://10.20.1.43:8006
    originRequest:
      noTLSVerify: true
  # The monitoring stack in 103/104/105. Each binds only its vmbr1 address, so
  # this tunnel is the single way in - nothing of theirs is on the office LAN.
  - hostname: beszel.anthonychiappone.com
    service: http://10.10.10.3:8090
  - hostname: uptime.anthonychiappone.com
    service: http://10.10.10.4:3001
  - hostname: pulse.anthonychiappone.com
    service: http://10.10.10.5:7655
  - service: http_status:404
