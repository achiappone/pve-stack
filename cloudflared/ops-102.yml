tunnel: 9c320e89-1beb-4267-98e1-95b8f07d0383
credentials-file: /etc/cloudflared/9c320e89-1beb-4267-98e1-95b8f07d0383.json

# pve-ops binds 127.0.0.1 inside this container, so the tunnel is the only path
# to it. Separate container and separate tunnel from the printer dashboard on
# purpose: when 101 wedges, this is what you use to see why.
#
# pve-ssh.* reaches the HOST, not this container - it is what lets the
# `npm run dev` tasks work from outside the office. Password auth is disabled
# on that host, and this must also be gated by Cloudflare Access or it is an
# open SSH endpoint on a hypervisor.
# (ssh.anthonychiappone.com was already taken by an unrelated record.)
#
# pve.* used to be served from here too. It moved to the host's own tunnel
# (cloudflared/host.yml): it is the host's service, and serving it from a
# container meant it died whenever the container did. Every hostname here still
# must sit behind a Cloudflare Access policy.
ingress:
  # 10.10.10.2, not localhost: pve-ops binds its vmbr1 address so the host's
  # tunnel can reach it too, which is what gives the dashboard a second route.
  # vmbr1 is host-only, so this is no more exposed than loopback was.
  - hostname: ops.anthonychiappone.com
    service: http://10.10.10.2:8780
  - hostname: pve-ssh.anthonychiappone.com
    service: ssh://10.20.1.43:22
  # The monitoring stack in 103/104/105. Each binds only its vmbr1 address, so
  # this tunnel is the single way in - nothing of theirs is on the office LAN.
  - hostname: beszel.anthonychiappone.com
    service: http://10.10.10.3:8090
  - hostname: uptime.anthonychiappone.com
    service: http://10.10.10.4:3001
  - hostname: pulse.anthonychiappone.com
    service: http://10.10.10.5:7655
  # The haze regulator on the DMX rig. Unlike everything else in this file the
  # origin sits on the office LAN, not vmbr1 - it is an ESP32 on wifi and there
  # is no host-only path to it. So this is the one hostname here whose origin is
  # reachable without the tunnel, which makes the Access policy load-bearing
  # rather than belt-and-braces: the firmware serves /update, an unauthenticated
  # firmware upload, and it drives a hazer.
  #
  # 10.20.5.52 is a DHCP lease, not a reservation. If the board moves this
  # breaks, and mDNS is filtered on the office wifi so haze.local is no fallback.
  - hostname: haze.anthonychiappone.com
    service: http://10.20.5.52
  # pd_lighting (CT 106): React app for the DMX rig. Binds its vmbr1 address only.
  # It drives physical fixtures on the office LAN and has multiple users, so the
  # app login (K2-style shared user/password, no Access) is the only auth layer.
  - hostname: lighting.pdlights.dev
    service: http://10.10.10.6:80
  - service: http_status:404
