# Make the JMicron 152d:0578 backup enclosure use plain usb-storage, not UAS.
#
# That bridge is a known-bad UAS implementation. The symptom here was sessions
# that got shorter every time - 27 min, 7 min, 3.5 min, then one second - each
# ending with the device vanishing mid-command:
#   sd 3:0:0:0: [sda] Synchronize Cache(10) failed: hostbyte=DID_ERROR
# UAS pipelines several commands at once; this bridge loses track and drops off
# the bus. usb-storage is slower and does not.
#
# The "u" flag is IGNORE_UAS. usb-storage owns the quirk table that uas also
# consults, so setting it here covers both drivers.
#
# usb-storage is in the initramfs, so this needs `update-initramfs -u` and a
# reboot - not just a module reload. Installed but never auto-applied, same as
# dell-smm-hwmon.conf: rebuilding the initramfs from a deploy is not something
# a deploy should decide to do.
options usb-storage quirks=152d:0578:u
