# Enable fan CONTROL on this host, not just fan readings.
#
# Without force=1 the driver publishes fan1/fan2 rpm and refuses every write:
# pwm1=255 is silently ignored and reads back 0, and pwm1_enable rejects any
# value but the one it already holds. That is the driver's model whitelist -
# the XPS 15 9570 is not on it, so fan control is withheld by default.
#
# force=1 bypasses that check. The kernel's warning is real: on a model the
# driver has not verified, these SMM BIOS calls can hang the machine. This box
# is the hypervisor, so a hang takes both dashboards, both tunnels and remote
# access with it. Enabled deliberately, with that understood.
#
# To back it out: delete this file and reboot, or
#   modprobe -r dell_smm_hwmon && modprobe dell_smm_hwmon
options dell_smm_hwmon force=1
