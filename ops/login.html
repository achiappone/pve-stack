<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Dev-Ops · pve-code1</title>
<style>
@font-face{font-family:"Public Sans";src:url(/fonts/public-sans-400-800-latin.woff2) format("woff2");font-weight:400 800;font-display:swap}
:root{--paper:#fdfdfc;--form:#1f4e8c;--rule:#b9c8db;--ink:#15171c;--ink-2:#4a505d;--crit:#c21d1d;
  --copy:#f6cfd8;--copy-deep:#e8a5b6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
  font:15px/1.5 "Public Sans",system-ui,sans-serif;caret-color:var(--form);padding:24px}
::selection{background:var(--copy-deep)}
.sheet{width:min(420px,100%);border:1px solid var(--form);background:var(--paper)}
.band{background:var(--copy);border-bottom:2px solid var(--form);padding:20px 24px 16px}
h1{margin:0;font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-.02em;color:var(--form)}
h1 b{color:var(--ink);font-weight:800}
.band p{margin:6px 0 0;font-size:13px;color:var(--ink-2)}
form{padding:20px 24px 24px;display:grid;gap:14px}
label{display:grid;gap:5px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--form)}
input{font:600 16px "Public Sans",sans-serif;color:var(--ink);background:var(--paper);
  border:0;border-bottom:1.5px solid var(--form);padding:7px 2px;border-radius:0}
input:focus{outline:none;border-bottom-width:2.5px;background:#f4f6f9}
button{margin-top:6px;font:700 13px/1 "Public Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;
  color:var(--paper);background:var(--form);border:1px solid var(--form);border-radius:2px;padding:12px;cursor:pointer;
  transition:background .15s cubic-bezier(.16,1,.3,1)}
button:hover{background:#163b6b}
button:focus-visible{outline:2px solid var(--form);outline-offset:3px}
.err{margin:0;min-height:20px;font-size:13px;font-weight:600;color:var(--crit)}
</style></head><body>
<main class="sheet">
  <div class="band">
    <h1>Dev-Ops &middot; <b>pve-code1</b></h1>
    <p>Sign in to see how this box is doing.</p>
  </div>
  <!-- A real form submission (not fetch), with name + autocomplete on both
       fields: that is what password managers look for before offering to save. -->
  <form method="post" action="/api/login">
    <label><span class="lbl">Username</span>
      <input id="username" name="username" autocomplete="username" autofocus required></label>
    <label><span class="lbl">Password</span>
      <input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <button>Sign in</button>
    <p class="err" id="e" role="alert"></p>
  </form>
</main>
<script>
if (new URLSearchParams(location.search).has("bad"))
  document.getElementById("e").textContent = "Wrong username or password. Try again.";
</script></body></html>
