<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Dev-Ops · pve-code1</title>
<style>
@font-face{font-family:"Geist";src:url(/fonts/geist-400-700-latin.woff2) format("woff2");font-weight:400 700;font-display:swap}
:root{--bg:#0a0f1d;--panel:#111a2e;--line:#1d2844;--text:#d7def0;--strong:#fff;--muted:#8a96b2;--crit:#f87171;
  --accent:#f472b6;--accent-2:#a78bfa;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:14px/1.5 "Geist",system-ui,sans-serif;
  background-image:radial-gradient(60% 50% at 50% 0%,color-mix(in srgb,var(--accent) 10%,transparent),transparent)}
.card{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
h1{margin:0;font-size:19px;font-weight:600;color:var(--strong)}
.sub{margin:0 0 20px;color:var(--muted);font-size:13.5px}
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
input{font:500 15px "Geist",sans-serif;color:var(--strong);background:#0d1526;border:1px solid var(--line);border-radius:9px;padding:10px 12px}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
button{margin-top:4px;font:600 14px "Geist",sans-serif;color:#06221d;background:var(--accent);border:0;border-radius:9px;padding:11px;cursor:pointer}
button:hover{filter:brightness(1.08)} button:focus-visible{outline:2px solid var(--strong);outline-offset:3px}
.err{margin:0;min-height:20px;font-size:13px;color:var(--crit)}
</style></head><body>
<main class="card">
  <div class="head"><span class="logo" aria-hidden="true"></span><h1>pve-code1</h1></div>
  <p class="sub">Dev-Ops. Sign in to see how this box is doing.</p>
  <!-- A real form submission (not fetch), with name + autocomplete on both
       fields: that is what password managers look for before offering to save. -->
  <form method="post" action="/api/login">
    <label>Username<input id="username" name="username" autocomplete="username" autofocus required></label>
    <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <button>Sign in</button>
    <p class="err" id="e" role="alert"></p>
  </form>
</main>
<script>
if (new URLSearchParams(location.search).has("bad"))
  document.getElementById("e").textContent = "Wrong username or password. Try again.";
</script></body></html>
