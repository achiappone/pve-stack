# /etc/k2-watch.conf - read by k2-watch.service (installed by pve-deploy).
# The printer is recognised by its Moonraker hostname (/printer/info), not by
# address or open port.
K2_HOSTNAME=K2Plus-05E6
LAN_IF=vmbr0
WIFI_IF=wlp59s0
# The host's lighting-network address: a wifi printer is routed via it.
LAN_VIA=2.0.0.43
